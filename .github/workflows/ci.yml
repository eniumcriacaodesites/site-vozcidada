name: ci

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Variáveis locais de exemplo
        run: |
          cp .env.example .env
          cp .dev.vars.example .dev.vars

      - name: Tipos (Astro + Vue)
        run: npm run check

      - name: Lint e formatação
        run: |
          npm run lint
          npm run format:check

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

      - name: Testes E2E
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
